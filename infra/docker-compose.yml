services:
  relay:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "${CAPSULE_PORT:-8787}:8787"
    environment:
      CAPSULE_HOST: 0.0.0.0
      CAPSULE_PORT: 8787
      CAPSULE_STORAGE_DIR: /data
      CAPSULE_CORS_ORIGIN: "${CAPSULE_CORS_ORIGIN:-http://localhost:5173}"
      CAPSULE_MAX_CAPSULE_BYTES: "${CAPSULE_MAX_CAPSULE_BYTES:-104857600}"
      CAPSULE_MAX_CHUNK_BYTES: "${CAPSULE_MAX_CHUNK_BYTES:-1048600}"
      CAPSULE_MAX_MANIFEST_BYTES: "${CAPSULE_MAX_MANIFEST_BYTES:-262144}"
      CAPSULE_MAX_CHUNK_COUNT: "${CAPSULE_MAX_CHUNK_COUNT:-10000}"
      CAPSULE_DEFAULT_TTL_SECONDS: "${CAPSULE_DEFAULT_TTL_SECONDS:-86400}"
      CAPSULE_MAX_TTL_SECONDS: "${CAPSULE_MAX_TTL_SECONDS:-604800}"
      CAPSULE_CLEANUP_INTERVAL_MS: "${CAPSULE_CLEANUP_INTERVAL_MS:-60000}"
      CAPSULE_LOG_LEVEL: "${CAPSULE_LOG_LEVEL:-info}"
      CAPSULE_RATE_LIMIT_MAX: "${CAPSULE_RATE_LIMIT_MAX:-300}"
      CAPSULE_RATE_LIMIT_WINDOW_MS: "${CAPSULE_RATE_LIMIT_WINDOW_MS:-60000}"
      CAPSULE_CREATE_RATE_LIMIT_MAX: "${CAPSULE_CREATE_RATE_LIMIT_MAX:-30}"
      CAPSULE_ALLOW_PERSISTENT_CAPSULES: "${CAPSULE_ALLOW_PERSISTENT_CAPSULES:-false}"
      CAPSULE_MAX_PERSISTENT_BYTES: "${CAPSULE_MAX_PERSISTENT_BYTES:-1073741824}"
      CAPSULE_MAX_PERSISTENT_BYTES_PER_SENDER: "${CAPSULE_MAX_PERSISTENT_BYTES_PER_SENDER:-134217728}"
      CAPSULE_IP_BLIND: "${CAPSULE_IP_BLIND:-true}"
      CAPSULE_PUBLIC_URL: "${CAPSULE_PUBLIC_URL:-}"
      CAPSULE_RELAY_NAME: "${CAPSULE_RELAY_NAME:-}"
      CAPSULE_PEERS: "${CAPSULE_PEERS:-}"
      CAPSULE_MAX_PEERS: "${CAPSULE_MAX_PEERS:-200}"
      CAPSULE_ANNOUNCE_POW_BITS: "${CAPSULE_ANNOUNCE_POW_BITS:-18}"
      CAPSULE_MAX_PEERS_PER_OPERATOR: "${CAPSULE_MAX_PEERS_PER_OPERATOR:-4}"
      CAPSULE_PEER_SYNC_INTERVAL_MS: "${CAPSULE_PEER_SYNC_INTERVAL_MS:-300000}"
      CAPSULE_ALLOW_PRIVATE_PEERS: "${CAPSULE_ALLOW_PRIVATE_PEERS:-false}"
      CAPSULE_MIX_ENABLED: "${CAPSULE_MIX_ENABLED:-true}"
      CAPSULE_MIX_COVER_INTERVAL_MS: "${CAPSULE_MIX_COVER_INTERVAL_MS:-30000}"
      CAPSULE_MIX_MAX_DELAY_MS: "${CAPSULE_MIX_MAX_DELAY_MS:-300000}"
      CAPSULE_MIX_MAX_QUEUED: "${CAPSULE_MIX_MAX_QUEUED:-2048}"
      CAPSULE_MIX_RATE_LIMIT_MAX: "${CAPSULE_MIX_RATE_LIMIT_MAX:-12000}"
    volumes:
      - capsule-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  capsule-data:
