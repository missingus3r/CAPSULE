<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="920" height="340" role="img" aria-labelledby="capsule-flow-title capsule-flow-desc">
<title id="capsule-flow-title">How a capsule travels</title>
<desc id="capsule-flow-desc">A file is encrypted in the sender's browser. The ciphertext goes to a relay and on to the receiver. The key travels separately, inside the fragment of the share link, which browsers never send to a server. The relay therefore stores bytes it cannot read.</desc>
<defs>
<marker id="tip-capsule-flow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 1 L 7 4 L 0 7 z" fill="#9e9e9e" />
</marker>
<marker id="tip-accent-capsule-flow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 1 L 7 4 L 0 7 z" fill="#000000" />
</marker>
</defs>
<rect width="920" height="340" fill="#f2f2f2" />
<text x="32" y="40" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#000000" letter-spacing="0.24em">CAPSULE</text>
<text x="32" y="72" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#3a3a3a">The key goes around the relay, not through it</text>
<path d="M 176 224 L 218 224" fill="none" stroke="#9e9e9e" stroke-width="1.25" marker-end="url(#tip-capsule-flow)" /><path d="M 350 224 L 392 224" fill="none" stroke="#9e9e9e" stroke-width="1.25" marker-end="url(#tip-capsule-flow)" /><rect x="343" y="217" width="56" height="14" fill="#f2f2f2" /><text x="371" y="227" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8a8a8a" letter-spacing="0.06em">ciphertext</text><path d="M 524 224 L 566 224" fill="none" stroke="#9e9e9e" stroke-width="1.25" marker-end="url(#tip-capsule-flow)" /><rect x="517" y="217" width="56" height="14" fill="#f2f2f2" /><text x="545" y="227" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8a8a8a" letter-spacing="0.06em">ciphertext</text><path d="M 698 224 L 740 224" fill="none" stroke="#9e9e9e" stroke-width="1.25" marker-end="url(#tip-capsule-flow)" /><path d="M 284 196 L 284 164 A 8 8 0 0 1 292 156 L 392 156" fill="none" stroke="#000000" stroke-width="1.25" marker-end="url(#tip-accent-capsule-flow)" /><rect x="272.1" y="161" width="23.799999999999997" height="14" fill="#f2f2f2" /><text x="284" y="171" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8a8a8a" letter-spacing="0.06em">key</text><path d="M 524 156 L 624 156 A 8 8 0 0 1 632 164 L 632 196" fill="none" stroke="#000000" stroke-width="1.25" marker-end="url(#tip-accent-capsule-flow)" /><rect x="620.1" y="161" width="23.799999999999997" height="14" fill="#f2f2f2" /><text x="632" y="171" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#8a8a8a" letter-spacing="0.06em">key</text><rect x="44" y="196" width="132" height="56" rx="8" fill="#ffffff" stroke="#dcdcdc" stroke-width="1" /><text x="110" y="216" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#8a8a8a" letter-spacing="0.18em">SENDER</text><text x="110" y="232" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3a3a3a">Your file</text><rect x="218" y="196" width="132" height="56" rx="8" fill="#ffffff" stroke="#dcdcdc" stroke-width="1" /><text x="284" y="216" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#8a8a8a" letter-spacing="0.18em">IN YOUR BROWSER</text><text x="284" y="232" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3a3a3a">Encrypted</text><text x="284" y="246" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#8a8a8a">AES-256-GCM</text><rect x="392" y="196" width="132" height="56" rx="8" fill="#ffffff" stroke="#dcdcdc" stroke-width="1" /><text x="458" y="216" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#8a8a8a" letter-spacing="0.18em">RELAY</text><text x="458" y="232" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3a3a3a">Stores bytes</text><text x="458" y="246" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#8a8a8a">cannot read</text><rect x="566" y="196" width="132" height="56" rx="8" fill="#ffffff" stroke="#dcdcdc" stroke-width="1" /><text x="632" y="216" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#8a8a8a" letter-spacing="0.18em">IN THEIR BROWSER</text><text x="632" y="232" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3a3a3a">Decrypted</text><rect x="740" y="196" width="132" height="56" rx="8" fill="#ffffff" stroke="#dcdcdc" stroke-width="1" /><text x="806" y="216" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#8a8a8a" letter-spacing="0.18em">RECEIVER</text><text x="806" y="232" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3a3a3a">The file</text><rect x="392" y="128" width="132" height="56" rx="8" fill="#ebebeb" stroke="#000000" stroke-width="2" /><text x="458" y="148" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#000000" letter-spacing="0.18em">THE LINK YOU SEND</text><text x="458" y="164" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#3a3a3a">#fragment</text><text x="458" y="178" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#8a8a8a">never sent to a server</text>
<line x1="32" y1="294" x2="888" y2="294" stroke="#dcdcdc" stroke-width="1" /><text x="32" y="314" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#8a8a8a" letter-spacing="0.05em">Solid — ciphertext, over the network</text><text x="317" y="314" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#8a8a8a" letter-spacing="0.05em">Black — the key, out of band</text><text x="602" y="314" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#8a8a8a" letter-spacing="0.05em">The relay never holds both</text>
</svg>
