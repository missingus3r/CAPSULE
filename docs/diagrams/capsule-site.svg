<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-labelledby="capsule-site-title capsule-site-desc">
<title id="capsule-site-title">How a .capsule site is published and read</title>
<desc id="capsule-site-desc">Publishing packs a folder into one encrypted capsule, stores it on relays, and signs a record saying which capsule is the current version of the name. The name itself is the public key, so the signature can be checked without trusting anyone. A visitor asks several relays, keeps the newest record that verifies, refuses an older one, and renders the page in a sandbox with no network access at all.</desc>
<defs>
<marker id="tip-capsule-site" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 1 L 7 4 L 0 7 z" fill="#b9b1a0" />
</marker>
<marker id="tip-accent-capsule-site" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 1 L 7 4 L 0 7 z" fill="#ef7959" />
</marker>
</defs>
<rect width="920" height="400" fill="#f3efe6" />
<text x="32" y="40" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#ef7959" letter-spacing="0.24em">SITES</text>
<text x="32" y="72" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#18352f">A name nobody issues, a page nobody can rewrite</text>
<path d="M 192 162 L 252 162" fill="none" stroke="#b9b1a0" stroke-width="1.25" marker-end="url(#tip-capsule-site)" /><rect x="207.8" y="155" width="28.4" height="14" fill="#f3efe6" /><text x="222" y="165" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#6b7772" letter-spacing="0.06em">pack</text><path d="M 400 162 L 460 162" fill="none" stroke="#b9b1a0" stroke-width="1.25" marker-end="url(#tip-capsule-site)" /><rect x="408.9" y="155" width="42.199999999999996" height="14" fill="#f3efe6" /><text x="430" y="165" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#6b7772" letter-spacing="0.06em">encrypt</text><path d="M 608 162 L 668 162" fill="none" stroke="#ef7959" stroke-width="1.25" marker-end="url(#tip-accent-capsule-site)" /><rect x="623.8" y="155" width="28.4" height="14" fill="#f3efe6" /><text x="638" y="165" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#6b7772" letter-spacing="0.06em">sign</text><path d="M 742 192 L 742 290 A 8 8 0 0 1 734 298 L 608 298" fill="none" stroke="#b9b1a0" stroke-width="1.25" marker-end="url(#tip-capsule-site)" /><rect x="695.6" y="219" width="92.8" height="14" fill="#f3efe6" /><text x="742" y="229" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#6b7772" letter-spacing="0.06em">relays hand it out</text><path d="M 460 298 L 400 298" fill="none" stroke="#b9b1a0" stroke-width="1.25" marker-end="url(#tip-capsule-site)" /><rect x="411.2" y="291" width="37.599999999999994" height="14" fill="#f3efe6" /><text x="430" y="301" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#6b7772" letter-spacing="0.06em">verify</text><path d="M 252 298 L 192 298" fill="none" stroke="#b9b1a0" stroke-width="1.25" marker-end="url(#tip-capsule-site)" /><rect x="200.9" y="291" width="42.199999999999996" height="14" fill="#f3efe6" /><text x="222" y="301" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#6b7772" letter-spacing="0.06em">decrypt</text><rect x="44" y="132" width="148" height="60" rx="8" fill="#fffdf8" stroke="#d5cec0" stroke-width="1" /><text x="118" y="152" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#6b7772" letter-spacing="0.18em">PUBLISHER</text><text x="118" y="168" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">A folder of files</text><text x="118" y="182" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">index.html and friends</text><rect x="252" y="132" width="148" height="60" rx="8" fill="#fffdf8" stroke="#d5cec0" stroke-width="1" /><text x="326" y="152" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#6b7772" letter-spacing="0.18em">BUNDLE</text><text x="326" y="168" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">One capsule</text><text x="326" y="182" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">padded to a size class</text><rect x="460" y="132" width="148" height="60" rx="8" fill="#fffdf8" stroke="#d5cec0" stroke-width="1" /><text x="534" y="152" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#6b7772" letter-spacing="0.18em">RELAYS</text><text x="534" y="168" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">Ciphertext only</text><text x="534" y="182" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">mirrored, or sharded</text><rect x="668" y="132" width="148" height="60" rx="8" fill="#fffdf8" stroke="#ef7959" stroke-width="1.5" /><text x="742" y="152" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#ef7959" letter-spacing="0.18em">THE NAME IS THE KEY</text><text x="742" y="168" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">Signed record</text><text x="742" y="182" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">&lt;key&gt;.capsule</text><rect x="460" y="268" width="148" height="60" rx="8" fill="#fffdf8" stroke="#d5cec0" stroke-width="1" /><text x="534" y="288" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#6b7772" letter-spacing="0.18em">VISITOR ASKS</text><text x="534" y="304" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">Several relays</text><text x="534" y="318" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">newest signed wins</text><rect x="252" y="268" width="148" height="60" rx="8" fill="#fffdf8" stroke="#d5cec0" stroke-width="1" /><text x="326" y="288" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#6b7772" letter-spacing="0.18em">IN THE BROWSER</text><text x="326" y="304" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">Checked, then read</text><text x="326" y="318" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">no rollback accepted</text><rect x="44" y="268" width="148" height="60" rx="8" fill="#fffdf8" stroke="#d5cec0" stroke-width="1" /><text x="118" y="288" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#6b7772" letter-spacing="0.18em">WHAT YOU SEE</text><text x="118" y="304" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">Sandboxed page</text><text x="118" y="318" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">cannot reach the web</text>
<line x1="32" y1="354" x2="888" y2="354" stroke="#d5cec0" stroke-width="1" /><text x="32" y="374" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#6b7772" letter-spacing="0.05em">Top — publishing, once per update</text><text x="317" y="374" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#6b7772" letter-spacing="0.05em">Bottom — visiting, every time</text><text x="602" y="374" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#6b7772" letter-spacing="0.05em">Coral — the only thing that has to be trusted: the key</text>
</svg>
