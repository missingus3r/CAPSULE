<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-labelledby="mix-network-title mix-network-desc">
<title id="mix-network-title">How a request travels through the mix network</title>
<desc id="mix-network-desc">A request is wrapped in a layer for each hop. The first hop sees the client's address, the middle hops see only their neighbours, and the storage relay sees a request with no client attached. The reply comes back along a second path the relay cannot see, into a mailbox the client polls.</desc>
<defs>
<marker id="tip-mix-network" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 1 L 7 4 L 0 7 z" fill="#b9b1a0" />
</marker>
<marker id="tip-accent-mix-network" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 1 L 7 4 L 0 7 z" fill="#ef7959" />
</marker>
</defs>
<rect width="920" height="360" fill="#f3efe6" />
<text x="32" y="40" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#ef7959" letter-spacing="0.24em">MIX NETWORK</text>
<text x="32" y="72" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#18352f">Every hop knows one step, and no hop knows two</text>
<path d="M 172 180 L 216 180" fill="none" stroke="#b9b1a0" stroke-width="1.25" marker-end="url(#tip-mix-network)" /><path d="M 344 180 L 388 180" fill="none" stroke="#b9b1a0" stroke-width="1.25" marker-end="url(#tip-mix-network)" /><path d="M 516 180 L 560 180" fill="none" stroke="#b9b1a0" stroke-width="1.25" marker-end="url(#tip-mix-network)" /><path d="M 688 180 L 732 180" fill="none" stroke="#b9b1a0" stroke-width="1.25" marker-end="url(#tip-mix-network)" /><path d="M 796 208 L 796 260 A 8 8 0 0 1 788 268 L 516 268" fill="none" stroke="#b9b1a0" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#tip-mix-network)" /><rect x="566" y="261" width="148" height="14" fill="#f3efe6" /><text x="640" y="271" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#6b7772" letter-spacing="0.06em">reply, by a path it cannot see</text><path d="M 388 268 L 116 268 A 8 8 0 0 1 108 260 L 108 208" fill="none" stroke="#b9b1a0" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#tip-mix-network)" /><rect x="178.8" y="261" width="74.39999999999999" height="14" fill="#f3efe6" /><text x="216" y="271" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" fill="#6b7772" letter-spacing="0.06em">you collect it</text><rect x="44" y="152" width="128" height="56" rx="8" fill="#fffdf8" stroke="#ef7959" stroke-width="1.5" /><text x="108" y="172" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#ef7959" letter-spacing="0.18em">YOU</text><text x="108" y="188" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">Your client</text><text x="108" y="202" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">one layer per hop</text><rect x="216" y="152" width="128" height="56" rx="8" fill="#fffdf8" stroke="#d5cec0" stroke-width="1" /><text x="280" y="172" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#6b7772" letter-spacing="0.18em">HOP 1</text><text x="280" y="188" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">Sees your address</text><text x="280" y="202" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">and nothing else</text><rect x="388" y="152" width="128" height="56" rx="8" fill="#fffdf8" stroke="#d5cec0" stroke-width="1" /><text x="452" y="172" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#6b7772" letter-spacing="0.18em">HOP 2</text><text x="452" y="188" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">Sees two hops</text><text x="452" y="202" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">neither end</text><rect x="560" y="152" width="128" height="56" rx="8" fill="#fffdf8" stroke="#d5cec0" stroke-width="1" /><text x="624" y="172" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#6b7772" letter-spacing="0.18em">HOP 3</text><text x="624" y="188" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">Sees the relay</text><text x="624" y="202" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">not you</text><rect x="732" y="152" width="128" height="56" rx="8" fill="#fffdf8" stroke="#ef7959" stroke-width="1.5" /><text x="796" y="172" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#ef7959" letter-spacing="0.18em">DESTINATION</text><text x="796" y="188" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">Storage relay</text><text x="796" y="202" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">no client address</text><rect x="388" y="240" width="128" height="56" rx="8" fill="#fffdf8" stroke="#d5cec0" stroke-width="1" /><text x="452" y="260" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7.5" fill="#6b7772" letter-spacing="0.18em">MAILBOX</text><text x="452" y="276" text-anchor="middle" font-family="Geist, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#18352f">Holds the answer</text><text x="452" y="290" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#6b7772">you poll it</text>
<line x1="32" y1="314" x2="888" y2="314" stroke="#d5cec0" stroke-width="1" /><text x="32" y="334" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#6b7772" letter-spacing="0.05em">Coral — the two ends, which never meet</text><text x="317" y="334" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#6b7772" letter-spacing="0.05em">Dashed — the reply, along a path the sender chose</text><text x="602" y="334" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" fill="#6b7772" letter-spacing="0.05em">Each hop waits a random time before forwarding</text>
</svg>
